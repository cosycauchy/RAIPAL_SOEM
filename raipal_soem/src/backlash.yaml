# backlash.yaml — backlash_test 전용 설정 (10 kg 원판을 단 상태에서 측정)
#
# 토크 단위: 1000 = 정격 토크 (모터 0.53 Nm = 출력 15 Nm)
# 위치 단위: 모터 엔코더 카운트

backlash_test:
  gear_ratio: 28.35
  counts_per_rev: 65536     # 모터 1바퀴 카운트. 선배 코드로 추정한 값 → 선배에게 확인할 것

  # ---- 측정 위치 ----
  num_positions: 4          # 출력 한 바퀴를 4곳(0, 90, 180, 270도)으로 나눠 잰다
  move_speed_cps: 50000     # 위치 사이를 옮기는 속도. 50000 = 출력 약 10도/초 (천천히)
  position_tolerance: 500   # 이 정도 안에 들어오면 도착으로 본다
  settle_s: 1.0             # 도착 후 원판이 멈출 때까지 기다리는 시간

  # ---- 진동 (백래시 측정) ----
  torque_mag: 20            # 정격의 2%. 선배는 10(1%)을 썼다. 폭이 안 나오면 조금씩 올린다
  flip_ms: 15               # 15 ms마다 +/- 뒤집기 (선배 값)
  measure_time_s: 2.0       # 한 위치에서 2초 동안 진동
  period_us: 500            # 루프 0.5 ms (선배 값)

  kp: 0                     # 위치 모드 게인. 선배 코드도 0 사용 (드라이버 기본값으로 보임)
  kd: 0

  # ---- 안전 ----
  max_vibration_travel: 3000  # 진동 중 원판이 이만큼 넘게 밀리면 즉시 정지
  max_follow_error: 20000     # 이동 중 목표와 실제 위치 차이가 이만큼 넘으면 즉시 정지
  temp_limit_c: 60            # 70도는 절대 넘기지 말 것 (선배)
  torque_hard_limit: 100      # 진동 토크가 절대 넘지 않는 상한 (정격 10%)
