# backlash.yaml — backlash_test 전용 설정
#
# 토크 단위: 1000 = 정격 토크 (모터 기준 0.53 Nm, 출력 기준 15 Nm)
#   예) 50 = 정격의 5% = 모터 0.027 Nm = 출력 약 0.75 Nm

backlash_test:
  gear_ratio: 28.35

  # 모터 엔코더 1회전당 카운트. 모르면 0으로 두면 각도 환산 없이 카운트로만 출력된다.
  # (선배에게 확인할 것. pos 값이 모터 쪽 엔코더인지 출력 쪽인지도 같이 확인)
  counts_per_rev: 0

  torque_amplitude: 50      # 처음엔 30~50 으로 시작. 기어 마찰에 묻혀 안 움직이면 조금씩 올린다
  ramp_time_s: 2.0          # 0 -> 최대까지 2초. 한 번 왕복(0 -> + -> 0 -> - -> 0) = 8초
  repeats: 5                # 5번 반복해서 평균
  settle_s: 1.0

  # ---- 안전 ----
  max_travel_counts: 2000   # 출력이 잠겨 있으면 백래시만큼만 움직인다. 이걸 넘으면 잠금이 풀린 것 -> 즉시 정지
  temp_limit_c: 60          # 70도는 절대 넘기지 말 것 (선배)
  torque_hard_limit: 200    # 코드가 절대 넘기지 않는 상한 (정격 20%)
